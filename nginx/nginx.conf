worker_processes auto;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    server_tokens off;
    # Docker DNS must be refreshed when Compose replaces the backend container.
    resolver 127.0.0.11 valid=5s ipv6=off;
    upstream qr_backend {
        zone qr_backend 64k;
        server backend:8000 resolve;
    }
    # Do not log student/session URLs or IPs outside the application database.
    access_log off;
    limit_req_zone $binary_remote_addr zone=global:10m rate=30r/s;
    server {
        listen 80;
        client_max_body_size 16k;
        limit_req zone=global burst=120 nodelay;
        limit_req_status 429;
        location / {
            proxy_pass http://qr_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
        }
    }
}
